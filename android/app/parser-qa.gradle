// Explicit opt-in, debug-only, independent identity. No production signing.
if (project.findProperty("kazumiTv") == "true") {
    throw new GradleException("Parser QA cannot be combined with the TV release overlay")
}
def fullUi = project.findProperty('kazumiQaFullUi')?.toString() == 'true'
if (fullUi && project.findProperty('kazumiQaLaunchOnly')?.toString() == 'true') {
    throw new GradleException('Full UI QA cannot use the offline launch profile')
}
repositories { maven { url 'https://maven.mozilla.org/maven2/' } }
android {
    flavorDimensions += "device"
    productFlavors {
        parserQa {
            dimension "device"
            applicationId "com.znbsf.kazumi.fluttertv.parserqa"
            minSdkVersion 26
            buildConfigField "boolean", "QA_LAUNCH_ONLY", "false"
            buildConfigField "boolean", "QA_FULL_UI", fullUi.toString()
            buildConfigField "boolean", "IS_TV_BUILD", fullUi.toString()
        }
        if (project.findProperty("kazumiQaLaunchOnly") == "true") {
            parserQaOffline {
                dimension "device"
                applicationId "com.znbsf.kazumi.fluttertv.parserqa"
                minSdkVersion 26
                buildConfigField "boolean", "QA_LAUNCH_ONLY", "true"
                buildConfigField "boolean", "QA_FULL_UI", "false"
            }
        }
    }
    sourceSets {
        parserQa {
            java.srcDirs += 'src/parserQa/kotlin'
            if (fullUi) {
                manifest.srcFile 'src/parserQaFullUi/AndroidManifest.xml'
                res.srcDirs += 'src/tv/res'
            }
        }
    }
    if (project.findProperty("kazumiQaLaunchOnly") == "true") {
        sourceSets {
            parserQaOffline {
                java.srcDirs += 'src/parserQa/kotlin'
                assets.srcDirs += 'src/parserQa/assets'
                manifest.srcFile 'src/parserQa/AndroidManifest.xml'
            }
            parserQaOfflineDebug {
                manifest.srcFile 'src/parserQaOfflineDebug/AndroidManifest.xml'
            }
        }
    }
    variantFilter { variant ->
        if (variant.buildType.name != 'debug') variant.setIgnore(true)
    }
}
apply from: 'parser-qa-abi.gradle'
project.ext.configureParserQaAbi.call(android)
dependencies {
    parserQaImplementation 'org.mozilla.geckoview:geckoview:146.0.20251217121356'
    if (project.findProperty("kazumiQaLaunchOnly") == "true") {
        add('parserQaOfflineImplementation', 'org.mozilla.geckoview:geckoview:146.0.20251217121356')
    }
}
