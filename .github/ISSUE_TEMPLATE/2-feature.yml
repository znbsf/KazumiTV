name: 期待新功能
description: 希望 KazumiTV 能添加一个新功能。
title: '[feat]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请填写以下内容，以方便我们讨论该功能的用途。
        填写前，请先查看 [Issues 列表](https://github.com/znbsf/KazumiTV/issues) 查看是否已经有和你主题重复的 Issue。重复 Issue 会被关闭。
        如果你的 KazumiTV 版本不为最新版，请先更新再查看该功能是否已被添加。旧版本的 Issue 可能不会被处理，因为新版可能已经添加了功能。

  - type: textarea
    id: reason
    attributes:
      label: 提出原因
      description: 为什么你想添加一个新功能？现在的哪个功能你不满意，还是这个功能目前并不存在？
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 你需要什么样的新功能？它有什么作用？它应该是如何工作的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 可供参考的内容
      description: |
        有没有某个应用已经实现了你想要的功能？那看起来是什么样的？
        提供截图可以更好地展示功能。


  - type: input
    id: tv-model
    attributes:
      label: 电视 / 盒子型号
      description: 填写品牌和完整型号；模拟器请注明 AVD / CPU 架构，非 TV 设备请说明。
    validations:
      required: false

  - type: input
    id: tv-android-version
    attributes:
      label: Android / Android TV / Google TV 版本
      description: 填写系统版本；不知道时可写未知。不要填写设备序列号。
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: KazumiTV 应用版本
      description: 请填写关于页面显示的版本及安装包来源；无法确认请说明。
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤或使用场景
      description: 涉及问题时写明遥控器按键、实际结果与预期结果；功能建议请描述操作流程。
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志 / 截图
      description: 可选。仅附必要片段；删除 token、Cookie、账号信息、签名播放 URL、设备标识和私有地址。无法安全脱敏时请勿上传。
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        本表单用于独立衍生项目 KazumiTV，不会提交给上游 Kazumi。
        日志和截图会公开：请删除 token、Cookie、账号信息、签名播放 URL、设备标识和私有地址。无需提供凭据；无法安全脱敏时请描述现象，不要上传原始日志。

  - type: checkboxes
    id: validations
    attributes:
      label: 提交前确认
      options:
        - label: 我已经查看了 [Issues 列表](https://github.com/znbsf/KazumiTV/issues) ，没有发现重复问题。
          required: true
        - label: 我知道一个新功能需要进行讨论并考虑是否添加，并不是一定会被接受。
          required: true
        - label: 我正在使用最新版本的 KazumiTV 应用，功能还没有添加。
          required: true
